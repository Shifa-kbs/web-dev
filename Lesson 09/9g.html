<!DOCTYPE html>
<html>
  <head>
    <title>Div-elements</title>
<style>
 
.container1{
  box-shadow: 0 0 6px rgba(0, 0, 0, 0.3);
  padding-bottom: 10px;
  margin-right: 0px;
  width: 120px;
  margin-bottom: 10px;
  display: inline-block;
}
.container2{
   box-shadow: 0 0 6px rgba(0, 0, 0, 0.3);
  padding-bottom: 10px;
  margin-right: 0px;
  width: 120px;
  margin-bottom: 10px;
  display: inline-block;
}
.container3{
   box-shadow: 0 0 6px rgba(0, 0, 0, 0.3);
  padding-bottom: 10px;
  margin-right: 0px;
  width: 120px;
  margin-bottom: 10px;
  display: inline-block;
}
.cat{
    width: 120px;
    height: 120px;
    object-fit: cover;
    object-position: center;
    margin-top: 0;
    vertical-align: middle;

    
  }
   .btn{
    background-color:rgb(54, 152, 233);
        border: none;
        font-weight:900 px;
        font-size: 13px;
         color: white;
        
         padding-left: 15px;
         padding-right: 15px;
         padding-top: 7px;
         padding-bottom: 7px;
         vertical-align: middle;
         margin-top: 0;
        margin-left: 5px;
       
  }
.name{
  font-weight: bold;
  font-family: Arial;
  margin-top: 5px;
  margin-bottom: 0;
  padding-left: 5px;
}
.friends{
  color: rgb(104, 103, 103);
  margin-top: 5px;
  margin-bottom: 7px;
 
  font-size: small;
  padding-left: 5px;
}
  </style>
  </head>
  <body>
    <div class="container1">
<img class="cat" src="cat.jpg">
<p class="name">Oliver</p>
<p class="friends">2 mutual friends</p>
<button class="btn">Add friend</button>
</div>
 <div class="container2">
<img class="cat" src="cat2.webp">
<p class="name">Mimi</p>
<p class="friends">3 mutual friends</p>
<button class="btn">Add friend</button>
</div>
 <div class="container3">
<img class="cat" src="cat3.webp">
<p class="name">Rex</p>
<p class="friends">4 mutual friends</p>
<button class="btn">Add friend</button>
</div>
    </body>
</html>
