<!DOCTYPE html>
<html>
  <head>
    <title>Position Absolute and Relative</title>
    <style>
      .close{
        color: white;
        background-color: black;
        position: absolute;
        top: -10px;
        left: 2px;
        border: none;
        padding-left: 13px;
        padding-right: 13px;
        padding-top: 8px;
        padding-bottom: 8px;
        font-size: 15px;
        height: 35px;
        border-radius: 50px;
  
      }
    </style>
  </head>
  <body style="height: 3000px;">
<div>
<div style="position: fixed;
bottom: 20px;
right: 20px;
width: 320px;
height: 180px;
background-color: gray;">
<button class="close">X</button>

</div>

</div>
  </body>
</html>
