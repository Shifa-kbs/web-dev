<!DOCTYPE html>
<html>
  <head>
    <title>Sign up form</title>
    <style>
      .name1,.name2{
display: inline-block;
width: 100px;
font-size: 15px;
padding-left: 10px;
padding-right: 20px;
padding-bottom: 10px;
padding-top: 10px;
border-radius: 7px;
border-width: 1px;
border-color: gray;
margin-bottom: 10px;
      }
      .mail{
        display: block;
        width: 235px;
        font-size: 15px;
        padding-left: 10px;
padding-right: 20px;
padding-bottom: 10px;
padding-top: 10px;
border-radius: 7px;
border-width: 1px;
border-color: gray;
margin-bottom: 10px;
      }
      .btn{
        color: white;
        background-color:rgb(18, 134, 229);
        border: none;
        width: 267px;
        padding-right: 20px;
        font-size: 18px;
padding-bottom: 10px;
padding-top: 10px;
border-radius: 7px;
border-width: 1px;
border-color: gray;
margin-bottom: 10px;
      }

    </style>
  </head>
  <body>
    <input class="name1" type="text" placeholder="First name">
     <input class="name2" type="text" placeholder="First name">
    <input class="mail" type="text" placeholder="Email">
    <button class="btn">Sign Up</button>
  </body>
</html>
