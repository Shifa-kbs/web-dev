<!DOCTYPE html>
<html>
  <head>
    <title>Display blocks</title>

      .firstbox,
      .secondbox{
        display: block;
        font-size: 15px;
      }
      .firstbox{
        margin-bottom: 7px;
      }

    <input class="secondbox" type="text" placeholder="Email">
  </body>
</html>
