<!DOCTYPE html>
<html>
  <head>
<title>The Cat Oliver</title>
<style>
  p{
    font-family: Roboto,Arial;
  }
  .cat{
    width: 50px;
    height: 50px;
    border-radius: 40px;
    object-fit: cover;
    display: inline-block;
  }
  .name{
    display: inline-block;
    vertical-align: top;
    margin-top: 10px;
    font-weight: bold;
    margin-left: 4px;
    margin-bottom: 0;
  }
  .who{
    margin-top: 0px;
    padding-top: 2px;
    margin-left: 4px;
    margin-bottom: 0;
    color: grey;
  }
  .fame{
    margin-top: 0;
    font-size: 15px;
     margin-left: 4px;
     color: grey;
  }
  .btn{
    color: white;
    font-weight: bold;
    background-color: rgb(68, 128, 238);
    border: none;
    padding-right: 10px;
    padding-left: 10px;
    padding-top: 7px;
    padding-bottom: 7px;
    border-radius: 6px;
    
  }
  .about-cat,.cat-image,.follow-btn{
    display: inline-block;
  }
  .about-cat{
    margin-right: 60px;
  }
  .cat-image{
    vertical-align: top;
    margin-top: 10px;
  }
  
  .follow-btn{
    vertical-align: top;
    margin-top: 20px;
    margin-left: 60px;
    
  }
  
</style>
  </head>
  <body>
    
    <div class="cat-image">
<img class="cat" src="cat.jpg">
    </div>
    <div class="about-cat">
      <p class="name">oliver</p>
    <p class="who">the cat</p>
    <p class="fame">Popular</p>
    </div>
    <div class="follow-btn">
       <button class="btn">Follow</button>
    </div>
  
    
   
  </body>
</html>
